spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    # No fallback — the docker profile requires explicit secrets.
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

terramap:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
