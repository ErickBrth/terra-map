services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-terramap}
      POSTGRES_USER: ${DB_USER:-terramap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terramap_local_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-terramap} -d ${DB_NAME:-terramap}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [terramap]

  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-terramap}
      DB_USER: ${DB_USER:-terramap}
      DB_PASSWORD: ${DB_PASSWORD:-terramap_local_password}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports: ["8080:8080"]
    networks: [terramap]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports: ["8081:80"]
    networks: [terramap]

volumes:
  db_data:

networks:
  terramap:
    driver: bridge
